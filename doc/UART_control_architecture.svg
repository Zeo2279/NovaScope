<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1150" height="720" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="575" y="42" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e293b">UART 串口控制子系统 —— 逻辑架构图</text>
  <line x1="220" y1="58" x2="930" y2="58" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ====== FPGA 边界框 ====== -->
  <rect x="250" y="80" width="870" height="610" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10,5" rx="14"/>
  <rect x="250" y="80" width="360" height="36" fill="#f1f5f9" rx="14"/>
  <rect x="250" y="100" width="360" height="16" fill="#f1f5f9"/>
  <text x="430" y="103" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#475569">FPGA 内部 (Ti60F225 · 96MHz 系统时钟域)</text>

  <!-- ================================================================ -->
  <!-- 左侧：PC 上位机 -->
  <!-- ================================================================ -->
  <rect x="30" y="270" width="170" height="110" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="305" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#854d0e">PC 上位机</text>
  <line x1="45" y1="316" x2="185" y2="316" stroke="#fef08a" stroke-width="1"/>
  <text x="115" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#475569">USB 转串口</text>
  <text x="115" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#475569">115200-8-N-1</text>

  <!-- ================================================================ -->
  <!-- 左侧底部：16×过采样注释 -->
  <!-- ================================================================ -->
  <rect x="30" y="460" width="220" height="155" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="140" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#334155">16× 过采样时序</text>
  <line x1="45" y1="497" x2="235" y2="497" stroke="#e2e8f0" stroke-width="1"/>

  <text x="45" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#475569">1 bit = 8.68μs = 833 clk</text>
  <text x="45" y="532" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#475569">= 16 采样拍 (每拍 52 clk)</text>

  <rect x="45" y="546" width="190" height="16" rx="2" fill="#e2e8f0"/>
  <rect x="45" y="546" width="16" height="16" rx="2" fill="#fca5a5"/>
  <text x="53" y="557" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#991b1b">0</text>
  <text x="68" y="557" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#64748b">1-6</text>
  <rect x="110" y="546" width="16" height="16" rx="2" fill="#bbf7d0"/>
  <text x="118" y="557" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#166534">7</text>
  <text x="135" y="557" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#64748b">8-14</text>
  <rect x="190" y="546" width="16" height="16" rx="2" fill="#fca5a5"/>
  <text x="198" y="557" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#991b1b">15</text>

  <text x="45" y="542" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#dc2626">边沿</text>
  <text x="110" y="542" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#16a34a">中心采样点</text>
  <text x="190" y="542" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#dc2626">边沿</text>

  <text x="45" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#334155">波特率切换:</text>
  <text x="45" y="596" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#475569">DEVIDE_CNT =</text>
  <text x="55" y="610" font-family="Consolas, monospace" font-size="11" fill="#475569">13→460800</text>
  <text x="145" y="610" font-family="Consolas, monospace" font-size="11" fill="#475569">52→115200</text>
  <text x="145" y="596" font-family="Consolas, monospace" font-size="11" fill="#475569">625→ 9600</text>

  <!-- ====== 图例 ====== -->
  <rect x="30" y="625" width="220" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="45" y="645" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#475569">━━ 数据流　　　- - 总线</text>
  <text x="45" y="665" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#475569">　│ 竖直路由　　─ 水平路由</text>

  <!-- ================================================================ -->
  <!-- FPGA 内部模块区 -->
  <!-- ================================================================ -->

  <!-- integer_divider (顶部) -->
  <rect x="370" y="115" width="400" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">integer_divider (波特率发生器)</text>
  <text x="570" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">DEVIDE_CNT = 52  ·  96MHz ÷ 52  ·  产生 16×bps 使能脉冲</text>

  <!-- ====== 左列：回环数据通道 ====== -->

  <!-- uart_receiver_0 -->
  <rect x="280" y="240" width="260" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="272" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">uart_receiver_0</text>
  <text x="410" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#3b82f6">数据通道 (Data Path · 回环)</text>
  <line x1="295" y1="306" x2="525" y2="306" stroke="#bfdbfe" stroke-width="1"/>
  <text x="410" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">状态机: IDLE → START</text>
  <text x="410" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">→ SAMPLE (8bit) → STOP → IDLE</text>

  <!-- uart_transfer_0 -->
  <rect x="280" y="450" width="260" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="480" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">uart_transfer_0</text>
  <text x="410" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#16a34a">回环发送 (Echo)</text>
  <text x="410" y="522" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">状态机: IDLE → SEND (10bit) → IDLE</text>

  <!-- ====== 右列：命令通道 ====== -->

  <!-- uart_receiver_1 -->
  <rect x="620" y="240" width="280" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="272" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#5b21b6">uart_receiver_1</text>
  <text x="760" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#7c3aed">命令通道 (Command Path)</text>
  <line x1="635" y1="306" x2="885" y2="306" stroke="#ddd6fe" stroke-width="1"/>
  <text x="760" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">状态机: IDLE → START</text>
  <text x="760" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">→ SAMPLE (8bit) → STOP → IDLE</text>

  <!-- uart_scope -->
  <rect x="620" y="450" width="280" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="480" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#9a3412">uart_scope</text>
  <text x="760" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#ea580c">命令协议解析器</text>
  <text x="760" y="522" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">解析序列: 报头0 → 报头1 → CMD → DATA</text>

  <!-- ====== 最右侧：ISP 控制输出 ====== -->
  <rect x="960" y="450" width="140" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="478" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">ISP 管线控制</text>
  <line x1="975" y1="488" x2="1085" y2="488" stroke="#86efac" stroke-width="1"/>
  <text x="1030" y="505" font-family="Consolas, monospace" font-size="10" text-anchor="middle" fill="#166534">ae_enable</text>
  <text x="1030" y="520" font-family="Consolas, monospace" font-size="10" text-anchor="middle" fill="#166534">sharpen_enable</text>
  <text x="1030" y="535" font-family="Consolas, monospace" font-size="10" text-anchor="middle" fill="#166534">model_select ...</text>

  <!-- ================================================================ -->
  <!-- 横平竖直连线 -->
  <!-- ================================================================ -->

  <!-- clken_16bps 竖直到分发总线 -->
  <path d="M 570 175 L 570 215" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- clken 横向总线 -->
  <path d="M 300 215 L 880 215" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3" fill="none"/>
  <text x="580" y="211" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">clken_16bps (使能脉冲总线)</text>

  <!-- 竖直分发 -->
  <path d="M 300 215 L 300 235" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 410 215 L 410 235" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 760 215 L 760 235" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- PC → FPGA: RXD (水平) -->
  <path d="M 200 310 L 340 310" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="270" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">RXD (fpga_rxd_0)</text>

  <!-- RXD 进入后一分二 -->
  <path d="M 340 310 L 410 310" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="375" y="303" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#2563eb">→ receiver_0</text>

  <!-- 竖直到中间层 y=385 -->
  <path d="M 340 310 L 340 385" stroke="#475569" stroke-width="2" fill="none"/>
  <!-- 水平到右侧 -->
  <path d="M 340 385 L 740 385" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <!-- 竖直上到 receiver_1 -->
  <path d="M 740 385 L 740 360" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="545" y="381" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">同一 RXD 并联驱动两个接收器</text>

  <!-- receiver_0 → transfer_0 (竖直回环数据通道) -->
  <path d="M 340 360 L 340 445" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="323" y="400" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#166534">rxd_data_0</text>

  <path d="M 460 360 L 460 445" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="478" y="400" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#166534">rxd_flag_0 → txd_en</text>

  <!-- transfer_0 → PC: TXD 回环 (L形) -->
  <path d="M 280 495 L 220 495" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <path d="M 220 495 L 220 350" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <path d="M 220 350 L 205 350" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="208" y="425" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#166534">TXD</text>
  <text x="208" y="438" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">fpga_txd_0</text>

  <!-- receiver_1 → uart_scope (竖直) -->
  <path d="M 680 360 L 680 445" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="663" y="400" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#9a3412">rxd_data_1</text>

  <path d="M 800 360 L 800 445" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="818" y="400" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#9a3412">rxd_flag_1</text>

  <!-- uart_scope → ISP 控制 (水平) -->
  <path d="M 900 495 L 955 495" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="928" y="488" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">7路控制信号</text>

  <!-- ================================================================ -->
  <!-- 命令协议展开 (底部) -->
  <!-- ================================================================ -->
  <rect x="280" y="590" width="820" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="290" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#334155">协议格式</text>

  <rect x="360" y="612" width="55" height="32" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="387" y="632" font-family="Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">0xAA</text>
  <text x="387" y="605" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">报头0</text>

  <text x="428" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8">→</text>

  <rect x="445" y="612" width="55" height="32" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="472" y="632" font-family="Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">0x55</text>
  <text x="472" y="605" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">报头1</text>

  <text x="513" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8">→</text>

  <rect x="530" y="612" width="75" height="32" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="567" y="632" font-family="Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e40af">CMD</text>
  <text x="567" y="605" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">命令码</text>

  <text x="618" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8">→</text>

  <rect x="635" y="612" width="75" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="672" y="632" font-family="Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#166534">DATA</text>
  <text x="672" y="605" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">参数值</text>

  <!-- 命令速查表 -->
  <text x="730" y="613" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#334155">CF: AE    5F: 锐化  6F: 缩放</text>
  <text x="730" y="633" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#334155">DF: 滤波  3F: 色彩  BF: 恢复</text>
  <text x="730" y="653" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#334155">AF: 中值  9F: 消光</text>

  <!-- ================================================================ -->
  <!-- 回环标注 -->
  <!-- ================================================================ -->
  <circle cx="298" cy="465" r="14" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
  <text x="298" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#166534">A</text>

  <circle cx="298" cy="510" r="14" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
  <text x="298" y="515" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#166534">B</text>

  <text x="298" y="555" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#16a34a">A → B 回环测试</text>
  <text x="298" y="568" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#16a34a">PC发→收→回→PC收</text>
</svg>
